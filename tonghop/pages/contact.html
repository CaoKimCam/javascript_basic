<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="../style/style.css">
</head>
<body id="contact">
    <div class="title">Contact us</div>
    <p style="font-weight: bold;">Thank you for your interest. Please send us comments using the form below:</p>
    <table>
        <tr>
            <td style="padding-right: 10px;">FirstName</td>
            <th>
                <input type="text" name="fname" id="fname" required>
            </th>
        </tr>
        <tr>
            <td>LastName</td>
            <td>
                <input type="text" name="lname" id="lname" required>
            </td>
        </tr>
        <tr>
            <td>Phone</td>
            <td>
                <input type="text" name="phone" id="phone">
            </td>
        </tr>
        <tr>
            <td>Email</td>
            <td>
                <input type="email" name="email" id="email">
            </td>
        </tr>
        <tr>
            <td>Comments</td>
            <td>
                <textarea name="comments" id="comments" rows="6" cols="40"></textarea>
            </td>
        </tr>
        <tr>
            <td></td>
            <td>
                <input type="checkbox">
                <labe>Send me your monthly newsletter</labe>
            </td>
        </tr>
        <tr>
            <td></td>
            <td>
                <input type="submit" value="Submit">
            </td>
        </tr>
    </table>
</body>
</html>
